  - "scaling_population_cpu [population_size=50]"
  - "scaling_population_cpu [population_size=100]"
  - "scaling_population_cpu [population_size=200]"
  - "scaling_population_cpu [population_size=400]"
  - "scaling_runs_cpu [n_runs=25]"
  - "scaling_runs_cpu [n_runs=50]"
  - "scaling_runs_cpu [n_runs=100]"
  - "scaling_runs_cpu [n_runs=200]"
  - "scaling_runs_cpu [n_runs=400]"
  - "scaling_neurons_scalar [n_neurons=11]"
