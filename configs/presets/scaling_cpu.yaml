  - "scaling_neurons_cpu [n_neurons=20]"
  - "scaling_neurons_cpu [n_neurons=30]"
  - "scaling_neurons_cpu [n_neurons=40]"
  - "scaling_neurons_cpu [n_neurons=50]"
