# Network Visualization Configuration for 11-neuron network
# 5 input neurons (0-4), 5 hidden neurons (5-9), 1 output neuron (10)

# Manual positions for neurons (x, y coordinates)
# x and y = coordinates starting from bottom left corner
# Input neurons: arranged horizontally at y=1
# Hidden neurons: arranged in middle layer at y=0.5
# Output neuron: centered at bottom at y=0
neuron_positions:
  0: [0.75, 2]     
  1: [1, 2]     
  2: [2, 2]      
  3: [3, 2]      
  4: [4, 2]      
  5: [0.75, 0]  
  6: [1, 0]  
  7: [2, 0]  
  8: [3, 0]  
  9: [4, 0]  
  10: [2.5, 1]   

# Neuron types and roles
neuron_types:
  0: input
  1: input
  2: input
  3: input
  4: input
  5: output
  6: output
  7: output
  8: output
  9: output
  10: hidden
