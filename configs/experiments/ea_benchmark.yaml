# ============================================================
# BENCHMARK CONFIGURATION
# ============================================================
# BENCHMARK MODE: simulation_seed: "from_file" + genome_type: <de novo>
#
# All simulation parameters (world size, food, brain config, max_ticks, n_runs)
# and run_seeds are loaded from the source HDF5 file so that the benchmark runs
# are directly comparable to the reference experiment.
# The genome is generated fresh using the settings below.
#
# Output file: <file_folder>/<filename>_BM_<simulation_name>.h5
# ============================================================
experiment:
  # Naming: appended to source filename as <filename>_BM_<simulation_name>
  simulation_name: "lookup_hard"

  # "from_file" triggers benchmark mode: loads all simulation parameters and
  # run_seeds from the source HDF5 file specified in from_file_source below.
  simulation_seed: "from_file"

  # Genome generation (de novo)
  genome_type: "lookup_hard"    # Options: "random", "lookup_soft", "lookup_hard"
  population_size: 1


  # Source file for simulation parameters and run_seeds
  from_file_source:
    file_folder: "data/flex_task/"
    filename: "2026-05-29_09-47-15_ea_from_random"
    # genome_ID and runs_to_load are not used in benchmark mode

  # Visualization
  viz_enabled: false
  viz_fps: 8
  viz_brain_enabled: false
  viz_brain_fps: 8

  # Data tracking
  enable_per_run_tracking: true
  enable_per_tick_tracking: true
  enable_heat_map_tracking: true
