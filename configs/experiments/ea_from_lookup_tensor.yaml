# ============================================================
# ea_from_lookup.yaml, evaluated with the batched tensor evaluator
# ============================================================
# Identical to ea_from_lookup.yaml except for `simulation_name` and the
# `experiment.evaluator` block below.
#
#   python -m simulate.run_ea --config ea_from_lookup_tensor
# ============================================================
experiment:
  # Output and file naming
  output_folder: "data/first_ea/"
  simulation_name: "ea_from_lookup_hard_tensor"
  simulation_seed: 1
  
  # Simulation runtime
  max_ticks: 2000
  n_runs: 300
  evolutionary_algorithm_enabled: true

  # Genome generation for first generation
  genome_type: "lookup_hard"  # Options: "random", "lookup_soft", "lookup_hard"
  population_size: 260

  # evolutionary algorithm
  evolutionary_algorithm:
    num_generations: 50
    elite_size: 10
    elite_selection_metric: 'average'  # Options: 'average', 'max', 'median'
    mutation_rate: 0.1  # Fraction of connections to mutate per individual; n_mutations = n_neurons^2 * mutation_rate
    mutation_strength: 0.2    # Gaussian std for all mutations (weights, reliability, eta, tonic activations)
    mutation_method: simple  # Options: 'simple'

  # Visualization
  viz_enabled: false
  viz_fps: 4
  viz_brain_enabled: false 
  viz_brain_fps: 4
  
  # Data tracking
  enable_per_run_tracking: false
  enable_per_tick_tracking: false
  enable_heat_map_tracking: false

  # ------------------------------------------------------------
  # BATCHED TENSOR EVALUATOR  (plan_evotorch.md Step 6, option A)
  # ------------------------------------------------------------
  # Replaces the scalar evaluation of each generation with the batched PyTorch
  # evaluator (mvb_torch/). Selection, mutation and HDF5 output are unchanged.
  # Delete this block (or set backend: scalar) to run the scalar evaluator instead.
  #
  # Every key is required once backend is "tensor":
  #   device            cpu | mps | cuda
  #   dtype             float32 | float64   (float64 only on cpu; MPS has no float64)
  #   philox_rounds     7-10, live mode only: Philox4x32 rounds for the keyed noise
  #                     and decisions (10 = standard). Replay must use the same count.
  #
  # The width (runs in flight at once) is not set here: it is chosen automatically --
  # every run at once unless device memory caps it (plan_evotorch.md Step 8, R3) --
  # and printed per generation. It cannot change results, only speed.
  #
  # Randomness is NOT set here: it follows `predrawn_randomness` (absent => live).
  # Live mode computes neuron noise and decisions with Philox4x32-10 from each run's
  # stored noise/decision seeds (mvb_torch/philox.py), so every stored elite run can be
  # replayed alone from the HDF5 (same device type and dtype). Results are
  # statistically equivalent to a scalar run, not identical to one. The worlds (food
  # grids) are identical to the scalar run's for the same simulation_seed.
  #
  # Tracking is supported by the tensor evaluator since Step 7, but run_ea switches
  # it off for every EA run anyway. Visualisation is not supported and must stay off.
  evaluator:
    backend: tensor
    device: mps
    dtype: float32
    philox_rounds: 10     # Philox4x32 rounds, 7-10 (live mode; replay must match)
    compile: true           # torch.compile (live mode; replay must match): on MPS verified bit-identical to eager and 2.2x per iteration (2026-10-09)


# ============================================================
# EMBEDDING CONFIGURATION
# ============================================================
world:
  grid_width: 51
  grid_height: 51
  start_pos:
  - 26
  - 26

food:
  - phase_from: 0
    feeding_paradigm:
      initial: true
      regrow: false
    initial_fraction_per_cell: 0.1
    regrow_time: 3000

worm:
  speed: 1
  energy_capacity: 30
  metabolic_rate: 1
  movement_cost: 1
  
  sensors:
    active:
    - current_field
    - adjacent_binary
  
  decisionmaking:
    version: plasticity
    brain: true

# ============================================================
# BRAIN CONFIGURATION
# ============================================================
brain:
  n_neurons: 11
  threshold: 0.5          # Applied to all neurons
  noise_level: 0.05       # Applied to all neurons
  
  # Neurons 0-4: sensory input, 5-9: output, 10: always-on
  # Tonic levels are set in genome generation (1.0 for neuron 10, random for others)
  
  # Sensory input mappings: which neuron receives which sensor
  # Format: sensor_key: [target_neuron_id, weight, reliability]
  sensory_mapping:
    on_food: [0, 1.0, 0.9]
    food_north: [1, 0.8, 0.9]
    food_east: [2, 0.8, 0.9]
    food_south: [3, 0.8, 0.9]
    food_west: [4, 0.8, 0.9]
  
  # Output mappings: which neurons drive which actions
  # Format: neuron_id: action_name
  output_mapping:
    5: stay
    6: move_north
    7: move_east
    8: move_south
    9: move_west
  
  # Decision-making parameters
  max_decision_delay: 2.0  # Factor for calculating max_ticks from warmup

