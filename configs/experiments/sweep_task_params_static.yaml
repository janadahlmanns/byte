# ============================================================
# EXPERIMENT CONFIGURATION
# ============================================================
experiment:
  # Output and file naming
  output_folder: "data/sweep_task_params_static/"
  simulation_name: "regrow_32_initial_0.1"
  simulation_seed: 1
  
  # Simulation runtime
  max_ticks: 2000
  n_runs: 300
  evolutionary_algorithm_enabled: true

  # Genome generation for first generation
  genome_type: "random"  # Options: "random", "lookup_soft", "lookup_hard"
  population_size: 250
    # Genome type specific parameters - random
  random_genome:
    wiring_randomization_seed: 1
    connectivity_degree_excitatory: 0.1
    connectivity_degree_inhibitory: 0.1
    modulation_degree_potentiation: 0.1
    modulation_degree_depression: 0.1

  # evolutionary algorithm
  evolutionary_algorithm:
    num_generations: 20 
    elite_size: 10
    elite_selection_metric: 'average'  # Options: 'average', 'max', 'median'
    mutation_rate: 0.1  # Fraction of connections to mutate per individual; n_mutations = n_neurons^2 * mutation_rate
    mutation_strength: 0.2    # Gaussian std for all mutations (weights, reliability, eta, tonic activations)
    mutation_method: simple  # Options: 'simple'

  # Visualization
  viz_enabled: false
  viz_fps: 4
  viz_brain_enabled: false 
  viz_brain_fps: 4
  
  # Data tracking
  enable_per_run_tracking: false
  enable_per_tick_tracking: false
  enable_heat_map_tracking: false
  

# ============================================================
# EMBEDDING CONFIGURATION
# ============================================================
world:
  grid_width: 51
  grid_height: 51
  start_pos:
  - 26
  - 26

food:
  - phase_from: 0
    feeding_paradigm:
      initial: true
      regrow: true
    initial_fraction_per_cell: 0.1
    regrow_time: 32


worm:
  speed: 1
  energy_capacity: 30
  metabolic_rate: 1
  movement_cost: 1
  
  sensors:
    active:
    - current_field
    - adjacent_binary
  
  decisionmaking:
    version: plasticity
    brain: true

# ============================================================
# BRAIN CONFIGURATION
# ============================================================
brain:
  n_neurons: 11
  threshold: 0.5          # Applied to all neurons
  noise_level: 0.05       # Applied to all neurons
  
  # Neurons 0-4: sensory input, 5-9: output, 10: always-on
  # Tonic levels are set in genome generation (1.0 for neuron 10, random for others)
  
  # Sensory input mappings: which neuron receives which sensor
  # Format: sensor_key: [target_neuron_id, weight, reliability]
  sensory_mapping:
    on_food: [0, 1.0, 0.9]
    food_north: [1, 0.8, 0.9]
    food_east: [2, 0.8, 0.9]
    food_south: [3, 0.8, 0.9]
    food_west: [4, 0.8, 0.9]
  
  # Output mappings: which neurons drive which actions
  # Format: neuron_id: action_name
  output_mapping:
    5: stay
    6: move_north
    7: move_east
    8: move_south
    9: move_west
  
  # Decision-making parameters
  max_decision_delay: 2.0  # Factor for calculating max_ticks from warmup

