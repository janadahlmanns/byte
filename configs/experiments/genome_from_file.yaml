# ============================================================
# EXPERIMENT CONFIGURATION
# ============================================================
experiment:
  # Genome generation
  genome_type: "from_file" # Options: "random", "lookup"m "from_file"
   # Genome type specific parameters - from_file
  from_file_genome:
    file_folder: "data/first_ea/"
    filename: "2026-05-05_17-28-53_lookup_hard"
    genome_ID: 'all'  # "all" or a list of genome indices to load from the file
    runs_to_load: 'all'  # "all" or a list of run indices to load from the file

  # Visualization
  viz_enabled: false
  viz_fps: 8
  viz_brain_enabled: false 
  viz_brain_fps: 8
  
  # Data tracking
  enable_per_run_tracking: true
  enable_per_tick_tracking: true
  enable_heat_map_tracking: true
  

