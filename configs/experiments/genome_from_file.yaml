# ============================================================
# EXPERIMENT CONFIGURATION
# ============================================================
experiment:
  # Genome source and seed source are independent:
  #   genome_type: "from_file"  →  load genomes from HDF5
  #   simulation_seed: "from_file"  →  load run_seeds + all simulation parameters from HDF5
  #
  # Modes:
  #   REPLAY    – genome_type: "from_file"  + simulation_seed: "from_file"
  #               Exact reproduction: genomes, seeds, and world/worm/brain config all from HDF5.
  #   BENCHMARK – genome_type: <de novo>   + simulation_seed: "from_file"
  #               Fresh genomes run on the same world seeds as a reference experiment.
  #   NORMAL    – genome_type: <de novo>   + simulation_seed: <integer>
  #               Fully fresh simulation, nothing loaded from file.
  #   TEST      – genome_type: "from_file"  + simulation_seed: <integer>
  #               Genome(s) loaded from file, run on a fresh simulation defined by this YAML.
  #               Requires the full world/food/worm/brain sections to be set below.

  genome_type: "from_file"      # Options: "random", "lookup_soft", "lookup_hard", "from_file"
  simulation_seed: "from_file"  # Options: integer (TEST/NORMAL), "from_file" (REPLAY/BENCHMARK)

  # Source file for genomes, seeds, and all simulation parameters.
  # Required when genome_type: "from_file" OR simulation_seed: "from_file".
  from_file_source:
    file_folder: "data/flex_task/"
    filename: "2026-06-01_16-19-45_flex_task_hard_70"
    genome_ID: [0]  # "all" or a list of genome indices — only used in replay mode
    runs_to_load: [2,3] # "all" or a list of run indices  — only used in replay mode

  # Visualization
  viz_enabled: true
  viz_fps: 8
  viz_brain_enabled: false 
  viz_brain_fps: 8
  
  # Data tracking
  enable_per_run_tracking: true
  enable_per_tick_tracking: true
  enable_heat_map_tracking: true
