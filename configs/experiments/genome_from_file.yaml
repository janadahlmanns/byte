# ============================================================
# EXPERIMENT CONFIGURATION
# ============================================================
experiment:
  # Genome generation
  genome_type: "from_file" # Options: "random", "lookup"m "from_file"
   # Genome type specific parameters - from_file
  from_file_genome:
    file_folder: "data/temp/"
    filename: "2026-04-30_12-12-10_test_ea"
    genome_ID: [0,1]  # "all" or a list of genome indices to load from the file
    runs_to_load: [0,1,2,3,4,5]  # "all" or a list of run indices to load from the file

  # Visualization
  viz_enabled: false
  viz_fps: 4
  viz_brain_enabled: false 
  viz_brain_fps: 4
  
  # Data tracking
  enable_per_run_tracking: true
  enable_per_tick_tracking: true
  enable_heat_map_tracking: false
  

