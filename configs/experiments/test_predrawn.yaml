# ============================================================
# REFERENCE CONFIG for the EvoTorch port (plan_evotorch.md Step 0)
# Small + deterministic: 8 genomes x 4 runs x 200 ticks on pre-drawn randomness.
# Run with:  python -m simulate.run_batch --config test_predrawn
# ============================================================
# EXPERIMENT CONFIGURATION
# ============================================================
experiment:
  # Output and file naming
  output_folder: "data/temp/"
  simulation_name: "test_predrawn"
  simulation_seed: 1
  
  # Simulation runtime
  max_ticks: 200            # crosses the phase switch at tick 40
  n_runs: 4
  evolutionary_algorithm_enabled: false

  # Genome generation for first generation
  genome_type: "random"  # Options: "random", "lookup_soft", "lookup_hard"
  population_size: 8
    # Genome type specific parameters - random
  random_genome:
    wiring_randomization_seed: 1
    connectivity_degree_excitatory: 0.1
    connectivity_degree_inhibitory: 0.1
    modulation_degree_potentiation: 0.1
    modulation_degree_depression: 0.1

  # Visualization
  viz_enabled: false
  viz_fps: 4
  viz_brain_enabled: false
  viz_brain_fps: 4
  
  # Data tracking
  enable_per_run_tracking: true
  enable_per_tick_tracking: true
  enable_heat_map_tracking: true

  # ============================================================
  # PRE-DRAWN RANDOMNESS  (test-only -- see mvb/predrawn.py, plan_evotorch.md Step 0)
  # ============================================================
  # Replaces the three live RNGs with a structurally indexed bundle so the tensor
  # port can be compared against a deterministic reference. Forces serial execution.
  # Omit this block (or set enabled: false) for normal runs -- the live path is then
  # byte-identical to before.
  predrawn_randomness:
    enabled: true
    max_brain_ticks: 32     # bound on decide()'s inner loop; asserted at runtime
  

# ============================================================
# EMBEDDING CONFIGURATION
# ============================================================
world:
  grid_width: 51
  grid_height: 51
  start_pos:
  - 26
  - 26

food:
  - phase_from: 0
    feeding_paradigm:
      initial: true
      regrow: false
    initial_fraction_per_cell: 0.1
    regrow_time: 200
  - phase_from: 40
    feeding_paradigm:
      initial: true
      regrow: true
    initial_fraction_per_cell: 0.05
    regrow_time: 4

worm:
  speed: 1
  energy_capacity: 30
  metabolic_rate: 1
  movement_cost: 1
  
  sensors:
    active:
    - current_field
    - adjacent_binary
  
  decisionmaking:
    version: plasticity
    brain: true

# ============================================================
# BRAIN CONFIGURATION
# ============================================================
brain:
  n_neurons: 11
  threshold: 0.5          # Applied to all neurons
  noise_level: 0.05       # Applied to all neurons
  
  # Neurons 0-4: sensory input, 5-9: output, 10: always-on
  # Tonic levels are set in genome generation (1.0 for neuron 10, random for others)
  
  # Sensory input mappings: which neuron receives which sensor
  # Format: sensor_key: [target_neuron_id, weight, reliability]
  sensory_mapping:
    on_food: [0, 1.0, 0.9]
    food_north: [1, 0.8, 0.9]
    food_east: [2, 0.8, 0.9]
    food_south: [3, 0.8, 0.9]
    food_west: [4, 0.8, 0.9]
  
  # Output mappings: which neurons drive which actions
  # Format: neuron_id: action_name
  output_mapping:
    5: stay
    6: move_north
    7: move_east
    8: move_south
    9: move_west
  
  # Decision-making parameters
  max_decision_delay: 2.0  # Factor for calculating max_ticks from warmup

