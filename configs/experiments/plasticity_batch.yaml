# ============================================================
# EXPERIMENT CONFIGURATION
# ============================================================
experiment:
  # Output and file naming
  output_folder: "data/temp/"
  simulation_name: "lookup_validation"
  simulation_seed: 1
  
  # Genome generation
  genome_type: "random"  # Options: "random", "lookup"
  n_variants: 1

  # genome type specific parameters - random
  wiring_randomization_seed: 1
  connectivity_degree_excitatory: 0.2
  connectivity_degree_inhibitory: 0.4
  modulation_degree_potentiation: 0.5
  modulation_degree_depression: 0.5
  
  # Simulation runtime
  max_ticks: 2000
  n_runs: 4
  
  # Visualization
  viz_enabled: true
  viz_fps: 4
  viz_brain_enabled: false
  viz_brain_fps: 4
  
  # Data tracking
  enable_per_run_tracking: false
  enable_per_tick_tracking: false
  enable_heat_map_tracking: false

# ============================================================
# EMBEDDING CONFIGURATION
# ============================================================
world:
  grid_width: 51
  grid_height: 51
  start_pos:
  - 26
  - 26
  generation_seed: 1

food:
  feeding_paradigm:
    initial: true
    regrow: false
  initial_fraction_per_cell: 0.25
  regrow_time: 3000

worm:
  speed: 1
  energy_capacity: 30
  metabolic_rate: 1
  movement_cost: 1
  
  sensors:
    active:
    - current_field
    - adjacent_binary
  
  decisionmaking:
    version: plasticity
    brain: true

# ============================================================
# BRAIN CONFIGURATION
# ============================================================
brain:
  n_neurons: 11
  threshold: 0.5          # Applied to all neurons
  noise_level: 0.05       # Applied to all neurons
  
  # Neurons 0-4: sensory input, 5-9: output, 10: always-on
  # Tonic levels are set in genome generation (1.0 for neuron 10, random for others)
  
  # Sensory input mappings: which neuron receives which sensor
  # Format: sensor_key: [target_neuron_id, weight, reliability]
  sensory_mapping:
    on_food: [0, 1.0, 0.9]
    food_north: [1, 0.8, 0.9]
    food_east: [2, 0.8, 0.9]
    food_south: [3, 0.8, 0.9]
    food_west: [4, 0.8, 0.9]
  
  # Output mappings: which neurons drive which actions
  # Format: neuron_id: action_name
  output_mapping:
    5: stay
    6: move_north
    7: move_east
    8: move_south
    9: move_west
  
  # Decision-making parameters
  max_decision_delay: 2.0  # Factor for calculating max_ticks from warmup

